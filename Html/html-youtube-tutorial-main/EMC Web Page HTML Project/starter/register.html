<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Register</title>
</head>
<body>

    <center>
    <h1>Error Makes Clever Academy🚀</h1>
    <h5>Training | Tech News | Freshers  Guide</h5>
    <p>Exploring young developers to level up their skills through training in software development technologies</p>

    </center>

    <hr>

    <center>

        <h1>Registration Form</h1>

        <form>
            <table>
                <tr>
                    <td>
                        Name
                    </td>
                    <td>
                        <input type="text" placeholder="Enter your name"> <br>
                    </td>
                </tr>
                <tr>
                    <td>
                        Age
                    </td>
                    <td>
                        <input type="number" placeholder="Enter your age"> <br>
                    </td>
                </tr>
                <tr>
                    <td>
                        Gender
                    </td>
                    <td>
                        <input type="radio" name="gender" value="Male"> <label>Male</label>
                        <input type="radio" name="gender" value="Female"> <label>Female</label> <br>
                    </td>
                </tr>
                <tr>
                    <td>
                        Email
                    </td>
                    <td>
                        <input type="email" placeholder="Enter your email"> <br>
                    </td>
                </tr>
                <tr>
                    <td>
                        Select a course
                    </td>
                    <td>
                        <select>
                            <option value="web-development">Web Development</option>
                            <option value="mobile-development">Mobile Development</option>
                            <option value="data-science">Data Science</option>
                        </select> <br>
                    </td>
                </tr>

                <tr>
                    <td>
                        Upload Your Resume
                    </td>
                    <td>
                        <input type="file" accept=".pdf,.doc,.docx">
                    </td>
                </tr>
                
                <tr>
                    <td>
                        <input type="Reset" value="Reset">
                    </td>
                    <td>
                        <input type="submit" value="Submit">
                    </td>
            </table>
        </form>
    </center>

    <hr>

    <center>

    <p>
        <a href="index.html">Home</a> | <a href="https://instagram.com">Instagram</a> |<a href="https://youtube.com">Youtube</a>
    </p>

    </center>

    <hr>
    
</body>
</html>
