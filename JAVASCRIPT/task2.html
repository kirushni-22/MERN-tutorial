<h2 id="result">Name</h2>

<button onclick="alter(event)" >john</button>
<button onclick="alter(event)" >Praveen</button>
<button onclick="alter(event)" >Karthick</button>


<script>
    var h2 = document.getElementById("result")
    
    function alter(event){
        h2.textContent = event.target.textContent
    }
</script>

<h1 onclick="deleteitem(event)">One</h1>

<h1  onclick="deleteitem(event)">Five</h1>
<h1  onclick="deleteitem(event)">Six</h1>



<script>
   
    function deleteitem(event){
        event.target.remove()
    }
</script>
