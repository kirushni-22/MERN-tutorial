<input id="one" onkeyup="show()">
<button onclick="show()">show</button>
<h1 id="two"></h1>

<script>
    var input = document.getElementById("one")
    var text = document.getElementById("two")

    function show(){

        text.textContent = input.value


    }
</script>

<button onclick="update()">Add</button>
<div id="result"></div>

<script>
    var div= document.getElementById("result")
    function update(){
        var  listitem=document.createElement("h1")
        listitem.textContent="Hello"
        div.append(listitem)
    }
</script>

<button id="btn" onclick="modify()" >Change color</button>

<script>
    var btn = document.getElementById("btn")
    function modify(){
        btn.style.backgroundColor = "red"
    }
</script>
